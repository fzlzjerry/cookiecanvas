[package]
name = "cookiecanvas-program"
version = "0.1.0"
edition = "2024"
description = "Minimal validated paint-event program for CookieCanvas on Cookie Chain"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "4.1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_os, values(\"solana\"))"] }
